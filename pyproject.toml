[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-spicrawl"
version = "0.1.0"
description = "LangChain integration for Spicrawl: a document loader and an agent tool that read web pages as Markdown"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Spicrawl" }]
keywords = [
    "langchain",
    "langchain-integration",
    "spicrawl",
    "web scraping",
    "web scraper",
    "document loader",
    "agent tool",
    "markdown",
    "html to markdown",
    "rag",
    "retrieval augmented generation",
    "llm",
    "ai agents",
    "scraping api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://docs.spicrawl.com"
Documentation = "https://docs.spicrawl.com"
Repository = "https://github.com/OfficialSpicrawl/langchain-spicrawl"
Issues = "https://github.com/OfficialSpicrawl/langchain-spicrawl/issues"

[dependency-groups]
test = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "respx>=0.21.0,<1.0.0",
    "langchain-tests>=1.1.0,<2.0.0",
]
lint = ["ruff>=0.13.1,<0.14.0"]
typing = ["mypy>=1.10"]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["langchain_spicrawl"]

[tool.mypy]
disallow_untyped_defs = true
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T201", "ASYNC", "RET", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
